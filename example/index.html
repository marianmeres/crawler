<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>@marianmeres/crawler — example</title>
		<meta
			name="description"
			content="Point it at a site, set the budgets, and watch a crawl happen: live counters, the pages as they land, and the link graph with the reason every skipped edge was skipped."
		/>
		<!-- Tracks the active (manually toggled) theme; updated by main.ts. -->
		<meta name="theme-color" content="#fafafa" />
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2210 0 100 100%22><text y=%22.90em%22 font-size=%2290%22>🕷️</text></svg>"
		/>

		<!--
			Styling follows @marianmeres/design-tokens with the Reboot bridge:
			  · reboot.css — Bootstrap Reboot element normalize/reset (consumes --bs-*)
			  · theme.css  — design-tokens "zinc" theme + reboot bridge
			                 (sets --stuic-color-* AND the --bs-* vars; dark on :root.dark)
			  · the inline block below — minimal, token-driven example layout
		-->
		<link rel="stylesheet" href="./reboot.css" />
		<link rel="stylesheet" href="./theme.css" />

		<!--
			Anti-FOUC: set the dark class before first paint so dark-preference
			users don't flash light. main.ts re-confirms this idempotently.
			The storage key must match THEME_KEY in main.ts.
		-->
		<script>
		try {
			var k = "crawler-example-theme";
			var s = localStorage.getItem(k);
			var d = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
			document.documentElement.classList.toggle("dark", d);
		} catch (e) {}
		</script>

		<style>
		:root {
			color-scheme: light;
		}
		:root.dark {
			color-scheme: dark;
		}

		.app {
			max-width: 84rem;
			margin: 0 auto;
			padding: clamp(1rem, 4vw, 2.5rem) clamp(1rem, 4vw, 2rem);
		}

		/* ---- header ---- */

		.app-header {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 1rem;
			margin-bottom: 1.75rem;
		}
		.app-header h1 {
			margin: 0 0 0.3rem;
			font-size: 1.05rem;
			font-weight: 600;
			line-height: 1.3;
		}
		.app-header h1 a {
			color: inherit;
			text-decoration: none;
		}
		.app-header h1 code {
			color: inherit;
			font-size: 0.95em;
		}
		.lead {
			max-width: 70ch;
			margin: 0;
			color: var(--stuic-color-muted-foreground);
			font-size: 0.9rem;
		}
		.theme-toggle {
			flex: none;
			width: 2.75rem;
			height: 2.75rem;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.5rem;
			background: var(--stuic-color-surface);
			color: var(--stuic-color-surface-foreground);
			font-size: 1.1rem;
			line-height: 1;
			cursor: pointer;
		}
		.theme-toggle:hover {
			background: var(--stuic-color-surface-hover);
		}

		/* ---- layout ---- */

		.layout {
			display: grid;
			grid-template-columns: minmax(0, 21rem) minmax(0, 1fr);
			gap: 1.5rem;
			align-items: start;
		}
		@media (max-width: 68rem) {
			.layout {
				grid-template-columns: minmax(0, 1fr);
			}
		}

		.card {
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.7rem;
			background: var(--stuic-color-surface);
			color: var(--stuic-color-surface-foreground);
			padding: 1rem 1.1rem;
		}
		.card + .card {
			margin-top: 1rem;
		}
		.card h2 {
			margin: 0 0 0.75rem;
			font-size: 0.8rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			color: var(--stuic-color-muted-foreground);
		}

		/* ---- form ---- */

		.field {
			margin-bottom: 0.85rem;
		}
		.field > label,
		.field > div > label,
		.legend {
			display: block;
			margin-bottom: 0.25rem;
			font-size: 0.78rem;
			font-weight: 500;
			color: var(--stuic-color-muted-foreground);
		}
		input[type="text"],
		input[type="number"],
		select,
		textarea {
			width: 100%;
			padding: 0.42rem 0.55rem;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.4rem;
			background: var(--stuic-color-background);
			color: var(--stuic-color-foreground);
			font-size: 0.85rem;
			font-family: inherit;
		}
		textarea {
			resize: vertical;
			min-height: 4.4rem;
			line-height: 1.5;
		}
		input:focus-visible,
		select:focus-visible,
		textarea:focus-visible {
			outline: 2px solid var(--stuic-color-primary);
			outline-offset: 1px;
		}
		.grid-2 {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 0.6rem;
		}

		.switch {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 0.35rem;
			padding: 0.25rem;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.5rem;
			background: var(--stuic-color-background);
		}
		.switch label {
			display: block;
			margin: 0;
			text-align: center;
			padding: 0.35rem 0.4rem;
			border-radius: 0.35rem;
			font-size: 0.8rem;
			cursor: pointer;
			color: var(--stuic-color-muted-foreground);
		}
		.switch input {
			position: absolute;
			opacity: 0;
			pointer-events: none;
		}
		.switch input:checked + span {
			display: block;
			margin: -0.35rem -0.4rem;
			padding: 0.35rem 0.4rem;
			border-radius: 0.35rem;
			background: var(--stuic-color-primary);
			color: var(--stuic-color-primary-foreground);
			font-weight: 500;
		}

		.checks {
			display: grid;
			gap: 0.3rem;
		}
		.checks label {
			display: flex;
			align-items: center;
			gap: 0.45rem;
			margin: 0;
			font-size: 0.82rem;
			cursor: pointer;
		}
		.checks input {
			margin: 0;
		}

		.actions {
			display: flex;
			gap: 0.5rem;
			margin-top: 1rem;
		}
		button.primary,
		button.ghost {
			flex: 1;
			padding: 0.5rem 0.7rem;
			border-radius: 0.45rem;
			font-size: 0.85rem;
			font-weight: 500;
			cursor: pointer;
			border: 1px solid transparent;
		}
		button.primary {
			background: var(--stuic-color-primary);
			color: var(--stuic-color-primary-foreground);
		}
		button.ghost {
			background: var(--stuic-color-surface);
			color: var(--stuic-color-surface-foreground);
			border-color: var(--stuic-color-border);
		}
		button:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}
		button.primary:not(:disabled):hover {
			filter: brightness(1.08);
		}
		button.ghost:not(:disabled):hover {
			background: var(--stuic-color-surface-hover);
		}

		/* ---- status / stats ---- */

		.status-row {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 0.4rem;
			margin-bottom: 0.75rem;
		}
		.badge {
			display: inline-block;
			padding: 0.1rem 0.45rem;
			border-radius: 999px;
			border: 1px solid var(--stuic-color-border);
			font-size: 0.72rem;
			font-weight: 500;
			white-space: nowrap;
		}
		.badge-run {
			border-color: var(--stuic-color-primary);
			color: var(--stuic-color-primary);
		}
		.badge-ok {
			border-color: var(--stuic-color-success);
			color: var(--stuic-color-success);
		}
		.badge-bad {
			border-color: var(--stuic-color-danger);
			color: var(--stuic-color-danger);
		}
		.badge-warn {
			border-color: var(--stuic-color-warning);
			color: var(--stuic-color-warning);
		}
		.spacer {
			flex: 1;
		}
		.muted {
			color: var(--stuic-color-muted-foreground);
			font-size: 0.78rem;
		}

		.bar {
			height: 0.4rem;
			border-radius: 999px;
			background: var(--stuic-color-muted);
			overflow: hidden;
			margin-bottom: 0.9rem;
		}
		.bar > i {
			display: block;
			height: 100%;
			width: 0%;
			background: var(--stuic-color-primary);
			transition: width 0.25s ease;
		}
		.bar.is-done > i {
			background: var(--stuic-color-success);
		}
		.bar.is-halted > i {
			background: var(--stuic-color-warning);
		}
		.bar.indeterminate > i {
			width: 35% !important;
			animation: slide 1.2s ease-in-out infinite alternate;
		}
		@keyframes slide {
			from {
				margin-left: 0;
			}
			to {
				margin-left: 65%;
			}
		}

		.tiles {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(6.2rem, 1fr));
			gap: 0.5rem;
		}
		.tile {
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.5rem;
			padding: 0.45rem 0.6rem;
			background: var(--stuic-color-background);
		}
		.tile b {
			display: block;
			font-size: 1.1rem;
			font-weight: 600;
			font-variant-numeric: tabular-nums;
			line-height: 1.25;
		}
		.tile span {
			font-size: 0.68rem;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			color: var(--stuic-color-muted-foreground);
		}

		/* ---- tabs + tables ---- */

		.tabs {
			display: flex;
			gap: 0.25rem;
			border-bottom: 1px solid var(--stuic-color-border);
			margin-bottom: 0.6rem;
		}
		.tabs button {
			border: 0;
			background: none;
			padding: 0.45rem 0.7rem;
			font-size: 0.83rem;
			color: var(--stuic-color-muted-foreground);
			border-bottom: 2px solid transparent;
			margin-bottom: -1px;
			cursor: pointer;
		}
		.tabs button[aria-selected="true"] {
			color: var(--stuic-color-foreground);
			border-bottom-color: var(--stuic-color-primary);
			font-weight: 500;
		}

		.tools {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			margin-bottom: 0.5rem;
		}
		.tools select {
			width: auto;
			font-size: 0.78rem;
			padding: 0.2rem 0.4rem;
		}

		.scroll {
			max-height: 30rem;
			overflow: auto;
			overflow-x: auto;
		}
		table {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.8rem;
		}
		thead th {
			position: sticky;
			top: 0;
			z-index: 1;
			background: var(--stuic-color-surface);
			text-align: left;
			font-weight: 500;
			font-size: 0.7rem;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			color: var(--stuic-color-muted-foreground);
			padding: 0.3rem 0.45rem;
			border-bottom: 1px solid var(--stuic-color-border);
			white-space: nowrap;
		}
		tbody td {
			padding: 0.3rem 0.45rem;
			border-bottom: 1px solid var(--stuic-color-border);
			vertical-align: top;
		}
		tbody tr:hover {
			background: var(--stuic-color-surface-hover);
		}
		td.num {
			text-align: right;
			font-variant-numeric: tabular-nums;
			white-space: nowrap;
		}
		td.url {
			max-width: 34rem;
			overflow-wrap: anywhere;
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 0.76rem;
		}
		td.url small {
			display: block;
			color: var(--stuic-color-muted-foreground);
			font-family: inherit;
		}
		.st {
			font-variant-numeric: tabular-nums;
			font-weight: 500;
		}
		.st-2 {
			color: var(--stuic-color-success);
		}
		.st-3 {
			color: var(--stuic-color-warning);
		}
		.st-4,
		.st-5,
		.st-x {
			color: var(--stuic-color-danger);
		}

		/* The links filter is CSS, not a re-render: rows are tagged once on insert. */
		tbody.only-followed tr:not(.is-followed) {
			display: none;
		}
		tbody.only-skipped tr:not(.is-skipped) {
			display: none;
		}

		/* ---- modal ---- */

		tbody tr.clickable {
			cursor: pointer;
		}
		tbody tr.clickable:focus-visible {
			outline: 2px solid var(--stuic-color-primary);
			outline-offset: -2px;
		}

		.modal-backdrop {
			position: fixed;
			inset: 0;
			z-index: 50;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: clamp(0.5rem, 3vw, 2rem);
			background: rgb(0 0 0 / 0.55);
		}
		.modal {
			display: flex;
			flex-direction: column;
			width: min(64rem, 100%);
			max-height: 90vh;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.7rem;
			background: var(--stuic-color-surface);
			color: var(--stuic-color-surface-foreground);
			overflow: hidden;
		}
		.modal-head {
			display: flex;
			align-items: flex-start;
			gap: 0.75rem;
			padding: 0.8rem 1rem;
			border-bottom: 1px solid var(--stuic-color-border);
		}
		.modal-head b {
			display: block;
			font-size: 0.92rem;
			font-weight: 600;
			line-height: 1.3;
		}
		.modal-head small {
			display: block;
			margin-top: 0.15rem;
			color: var(--stuic-color-muted-foreground);
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 0.74rem;
			overflow-wrap: anywhere;
		}
		.modal-close {
			flex: none;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.4rem;
			background: var(--stuic-color-background);
			color: inherit;
			width: 2rem;
			height: 2rem;
			cursor: pointer;
			line-height: 1;
		}
		.modal-close:hover {
			background: var(--stuic-color-surface-hover);
		}
		.modal .tabs {
			margin: 0 1rem;
		}
		.modal-body {
			flex: 1;
			overflow: auto;
			padding: 0.9rem 1rem 1.1rem;
		}

		.badges {
			display: flex;
			flex-wrap: wrap;
			gap: 0.3rem;
			margin-top: 0.4rem;
		}

		.frame {
			width: 100%;
			height: 62vh;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.45rem;
			background: #fff;
		}

		pre.code {
			margin: 0;
			padding: 0.7rem 0.8rem;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.45rem;
			background: var(--stuic-color-background);
			font-size: 0.74rem;
			line-height: 1.5;
			white-space: pre-wrap;
			overflow-wrap: anywhere;
			max-height: 62vh;
			overflow: auto;
		}

		.sec {
			margin-bottom: 1.1rem;
		}
		.sec > h3 {
			margin: 0 0 0.15rem;
			font-size: 0.74rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			color: var(--stuic-color-muted-foreground);
		}
		.sec > p.note {
			margin: 0 0 0.5rem;
			font-size: 0.76rem;
			color: var(--stuic-color-muted-foreground);
		}
		dl.kv {
			display: grid;
			grid-template-columns: minmax(6rem, max-content) minmax(0, 1fr);
			gap: 0.15rem 0.8rem;
			margin: 0;
			font-size: 0.79rem;
		}
		dl.kv dt {
			color: var(--stuic-color-muted-foreground);
		}
		dl.kv dd {
			margin: 0;
			overflow-wrap: anywhere;
			font-variant-numeric: tabular-nums;
		}

		.placeholder {
			margin: 0;
			padding: 2rem 0;
			text-align: center;
			color: var(--stuic-color-muted-foreground);
			font-size: 0.85rem;
		}
		.notes {
			margin: 0.75rem 0 0;
			padding: 0.5rem 0.7rem;
			border: 1px dashed var(--stuic-color-warning);
			border-radius: 0.45rem;
			font-size: 0.78rem;
			color: var(--stuic-color-muted-foreground);
		}
		.notes ul {
			margin: 0.25rem 0 0;
			padding-left: 1.1rem;
		}
		.error-box {
			margin: 0.75rem 0 0;
			padding: 0.5rem 0.7rem;
			border: 1px solid var(--stuic-color-danger);
			border-radius: 0.45rem;
			font-size: 0.8rem;
			color: var(--stuic-color-danger);
			overflow-wrap: anywhere;
		}

		/* ---- recent runs ---- */

		.recent {
			display: grid;
			gap: 0.3rem;
			margin: 0;
			padding: 0;
			list-style: none;
			max-height: 22rem;
			overflow-y: auto;
		}
		.recent button {
			width: 100%;
			text-align: left;
			border: 1px solid var(--stuic-color-border);
			border-radius: 0.45rem;
			background: var(--stuic-color-background);
			padding: 0.35rem 0.5rem;
			font-size: 0.78rem;
			cursor: pointer;
			overflow-wrap: anywhere;
		}
		.recent button:hover {
			background: var(--stuic-color-surface-hover);
		}
		.recent small {
			display: block;
			color: var(--stuic-color-muted-foreground);
			font-size: 0.72rem;
		}

		.app-footer {
			margin-top: 2rem;
			padding-top: 1rem;
			border-top: 1px solid var(--stuic-color-border);
			font-size: 0.78rem;
			color: var(--stuic-color-muted-foreground);
		}
		.app-footer a {
			color: inherit;
		}
		</style>
	</head>

	<body>
		<template id="tpl-app">
			<div class="app">
				<header class="app-header">
					<div>
						<h1>
							<a href="https://jsr.io/@marianmeres/crawler" target="_blank"
								rel="noreferrer"><code>@marianmeres/crawler</code></a>
							— interactive example
						</h1>
						<p class="lead">
							Point it at a site, set the budgets, and watch a crawl happen.
							The crawl runs on the server against PostgreSQL; this page
							polls its progress out of the crawler's own tables — which is
							exactly how you would watch one from another process.
						</p>
					</div>
					<button class="theme-toggle" type="button" title="Toggle theme"
						data-on="click:toggleTheme">◑</button>
				</header>

				<div class="layout">
					<!-- ---- controls ---- -->
					<div>
						<form class="card" data-ref="form" data-on="submit:submit">
							<h2>Crawl</h2>

							<div class="field">
								<label for="seeds">Seed URLs — one per line</label>
								<textarea id="seeds" data-ref="seeds" spellcheck="false"
									rows="3"></textarea>
							</div>

							<div class="field">
								<span class="legend">Runner</span>
								<div class="switch">
									<label>
										<input type="radio" name="mode" value="direct"
											data-ref="modeDirect" checked />
										<span>direct</span>
									</label>
									<label>
										<input type="radio" name="mode" value="queue"
											data-ref="modeQueue" />
										<span>queued</span>
									</label>
								</div>
								<p class="muted" data-ref="modeHint"
									style="margin: 0.3rem 0 0"></p>
							</div>

							<div class="field grid-2">
								<div>
									<label for="maxDepth">Max depth</label>
									<input id="maxDepth" type="number" min="0" max="6"
										data-ref="maxDepth" />
								</div>
								<div>
									<label for="maxPages">Max pages</label>
									<input id="maxPages" type="number" min="1" max="300"
										data-ref="maxPages" />
								</div>
							</div>

							<div class="field grid-2">
								<div>
									<label for="concurrency">Concurrency</label>
									<input id="concurrency" type="number" min="1" max="8"
										data-ref="concurrency" />
								</div>
								<div>
									<label for="perHostDelay">Per-host delay (ms)</label>
									<input id="perHostDelay" type="number" min="0"
										step="50" data-ref="perHostDelay" />
								</div>
							</div>

							<div class="field">
								<label for="maxDuration">Time budget (s)</label>
								<input id="maxDuration" type="number" min="5" max="300"
									data-ref="maxDuration" />
							</div>

							<div class="field">
								<label for="subdomains">Host scope</label>
								<select id="subdomains" data-ref="subdomains">
									<option value="same-host">same-host</option>
									<option value="same-site">same-site</option>
									<option value="any">any</option>
								</select>
							</div>

							<div class="field checks">
								<label>
									<input type="checkbox" data-ref="allowExternal" />
									Follow links off-site
								</label>
								<label>
									<input type="checkbox" data-ref="checkExternal" />
									Check external links (broken-link mode)
								</label>
								<label>
									<input type="checkbox" data-ref="assets" />
									Extract assets (img, css, script)
								</label>
								<label>
									<input type="checkbox" data-ref="sitemaps" />
									Seed from robots.txt sitemaps
								</label>
								<label>
									<input type="checkbox" data-ref="respectRobots" checked />
									Respect robots.txt
								</label>
								<label>
									<input type="checkbox" data-ref="persistBody"
										checked />
									Archive rendered HTML
								</label>
								<label>
									<input type="checkbox" data-ref="js" />
									<span
										data-ref="jsLabel">Render with JS (browser)</span>
								</label>
							</div>

							<p class="muted" data-ref="jsHint"
								style="margin: 0.1rem 0 0"></p>

							<div class="actions">
								<button class="primary" type="submit" data-ref="startBtn">
									Crawl
								</button>
								<button class="ghost" type="button" data-ref="stopBtn"
									data-on="click:stop" disabled>Stop</button>
							</div>
						</form>

						<div class="card">
							<h2>Recent runs</h2>
							<ul class="recent" data-ref="recent"></ul>
							<p class="placeholder" data-ref="recentEmpty"
								style="padding: 0.5rem 0">Nothing yet.</p>
						</div>
					</div>

					<!-- ---- live panel ---- -->
					<div>
						<div class="card">
							<div class="status-row">
								<span class="badge" data-ref="statusBadge">idle</span>
								<span class="badge" data-ref="jobBadge" hidden></span>
								<span class="badge" data-ref="stoppedBadge" hidden></span>
								<span class="spacer"></span>
								<span class="muted" data-ref="elapsed"></span>
							</div>

							<div class="bar"
								data-ref="bar"><i data-ref="barFill"></i></div>

							<div class="tiles">
								<div
									class="tile"><b data-ref="tDone">0</b><span>done</span></div>
								<div
									class="tile"><b data-ref="tFailed">0</b><span>failed</span></div>
								<div
									class="tile"><b data-ref="tSkipped">0</b><span>skipped</span></div>
								<div
									class="tile"><b data-ref="tQueued">0</b><span>queued</span></div>
								<div
									class="tile"><b data-ref="tFlight">0</b><span>in flight</span></div>
								<div
									class="tile"><b data-ref="tBytes">0 B</b><span>bytes</span></div>
								<div
									class="tile"><b data-ref="tRate">0</b><span>pages / s</span></div>
								<div
									class="tile"><b data-ref="tEta">—</b><span>eta</span></div>
							</div>

							<div class="notes" data-ref="notes" hidden></div>
							<div class="error-box" data-ref="errorBox" hidden></div>
						</div>

						<div class="card">
							<div class="tabs" data-ref="tabs">
								<button type="button" data-tab="pages"
									aria-selected="true"
									data-on="click:tab">Pages <span data-ref="cPages">0</span></button>
								<button type="button" data-tab="links"
									aria-selected="false"
									data-on="click:tab">Links <span data-ref="cLinks">0</span></button>
								<button type="button" data-tab="broken"
									aria-selected="false"
									data-on="click:tab">Broken <span data-ref="cBroken">—</span></button>
							</div>

							<!-- pages -->
							<div data-ref="panePages">
								<div class="tools">
									<span class="muted" data-ref="pagesNote"></span>
								</div>
								<div class="scroll">
									<table>
										<thead>
											<tr>
												<th>status</th>
												<th>d</th>
												<th>url</th>
												<th>type</th>
												<th class="num">size</th>
												<th class="num">ms</th>
											</tr>
										</thead>
										<tbody data-ref="pagesBody"></tbody>
									</table>
								</div>
								<p class="placeholder" data-ref="pagesEmpty">
									No pages yet.
								</p>
							</div>

							<!-- links -->
							<div data-ref="paneLinks" hidden>
								<div class="tools">
									<label for="linkFilter" class="muted"
										style="margin: 0">Show</label>
									<select id="linkFilter" data-ref="linkFilter"
										data-on="change:filterLinks">
										<option value="">every edge</option>
										<option value="followed">followed only</option>
										<option value="skipped">skipped only</option>
									</select>
									<span class="muted" data-ref="linksNote"></span>
								</div>
								<div class="scroll">
									<table>
										<thead>
											<tr>
												<th>link target</th>
												<th>kind</th>
												<th>rel</th>
												<th>followed</th>
												<th>skipped as</th>
											</tr>
										</thead>
										<tbody data-ref="linksBody"></tbody>
									</table>
								</div>
								<p class="placeholder" data-ref="linksEmpty">
									No links yet.
								</p>
							</div>

							<!-- broken -->
							<div data-ref="paneBroken" hidden>
								<div class="scroll">
									<table>
										<thead>
											<tr>
												<th>dead target</th>
												<th>status</th>
												<th class="num">linked from</th>
											</tr>
										</thead>
										<tbody data-ref="brokenBody"></tbody>
									</table>
								</div>
								<p class="placeholder" data-ref="brokenEmpty">
									The report is built once the crawl ends. Only targets
									visited in the same run can appear — tick
									<em>Check external links</em> to see dead outbound ones.
								</p>
							</div>
						</div>

						<footer class="app-footer">
							<a href="https://jsr.io/@marianmeres/crawler" target="_blank"
								rel="noreferrer">@marianmeres/crawler</a>
							<span data-ref="version"></span> · the server clamps every
							budget — see <code>CAPS</code> in
							<code>example/server.ts</code>.
						</footer>
					</div>
				</div>
				<div data-ref="modalHost"></div>
			</div>
		</template>

		<template id="tpl-modal">
			<div class="modal-backdrop" data-on="click:backdrop">
				<div class="modal" role="dialog" aria-modal="true"
					aria-label="Fetched page">
					<div class="modal-head">
						<div style="min-width: 0">
							<b data-ref="title"></b>
							<small data-ref="url"></small>
							<div class="badges" data-ref="badges"></div>
						</div>
						<button class="modal-close" type="button" title="Close"
							data-on="click:closeModal">✕</button>
					</div>

					<div class="tabs" data-ref="mtabs">
						<button type="button" data-tab="preview" aria-selected="true"
							data-on="click:mtab">Preview</button>
						<button type="button" data-tab="source" aria-selected="false"
							data-on="click:mtab">HTML source</button>
						<button type="button" data-tab="extracted" aria-selected="false"
							data-on="click:mtab">Extracted</button>
					</div>

					<div class="modal-body">
						<div data-ref="panePreview">
							<p class="muted" style="margin: 0 0 0.5rem">
								The archived DOM, rendered in a sandboxed iframe — no
								scripts, no same-origin. A <code>&lt;base&gt;</code> is
								injected so the page's own CSS and images still resolve.
							</p>
							<iframe class="frame" data-ref="frame" sandbox=""
								referrerpolicy="no-referrer"
								title="Page preview"></iframe>
						</div>

						<div data-ref="paneSource" hidden>
							<p class="muted" style="margin: 0 0 0.5rem"
								data-ref="sourceNote"></p>
							<pre class="code" data-ref="source"></pre>
						</div>

						<div data-ref="paneExtracted" hidden>
							<div class="sec">
								<h3>At crawl time</h3>
								<p class="note">
									What <code>onPage</code> returned, stored on the row as
									<code>__crawler_page.data</code> — queryable without
									touching the archive.
								</p>
								<dl class="kv" data-ref="stored"></dl>
							</div>

							<div class="sec">
								<h3>Now, from the archive</h3>
								<p class="note">
									<code>extract()</code> re-run on the stored body, so
									changing what is extracted is a reload, not a re-crawl.
								</p>
								<dl class="kv" data-ref="fresh"></dl>
							</div>

							<div class="sec" data-ref="markdownSec">
								<h3>Main content — markdown</h3>
								<pre class="code" data-ref="markdown"></pre>
							</div>

							<div class="sec" data-ref="structuredSec">
								<h3>Structured data</h3>
								<pre class="code" data-ref="structured"></pre>
							</div>
						</div>
					</div>
				</div>
			</div>
		</template>

		<template id="tpl-page-row">
			<tr class="clickable" tabindex="0" data-on="click:openPage;keydown:openPage">
				<td><span class="st" data-ref="status"></span></td>
				<td class="num" data-ref="depth"></td>
				<td class="url">
					<span data-ref="url"></span>
					<small data-ref="title"></small>
				</td>
				<td data-ref="type"></td>
				<td class="num" data-ref="size"></td>
				<td class="num" data-ref="ms"></td>
			</tr>
		</template>

		<template id="tpl-link-row">
			<tr>
				<td class="url">
					<span data-ref="to"></span>
					<small data-ref="from"></small>
				</td>
				<td data-ref="kind"></td>
				<td data-ref="rel"></td>
				<td data-ref="followed"></td>
				<td data-ref="why"></td>
			</tr>
		</template>

		<template id="tpl-broken-row">
			<tr>
				<td class="url">
					<span data-ref="url"></span>
					<small data-ref="from"></small>
				</td>
				<td><span class="st" data-ref="status"></span></td>
				<td class="num" data-ref="count"></td>
			</tr>
		</template>

		<template id="tpl-recent-row">
			<li>
				<button type="button" data-on="click:openRun">
					<span data-ref="seed"></span>
					<small data-ref="meta"></small>
				</button>
			</li>
		</template>

		<div id="app"></div>

		<script type="module" src="./dist/bundle.js"></script>
	</body>
</html>
